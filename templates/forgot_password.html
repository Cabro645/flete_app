{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Recuperar contraseña · FleteApp{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 480px;">
  <div class="panel p-4 shadow">
    <h1 class="h4 fw-bold text-primary mb-3">Recuperar contraseña</h1>
    <p class="small text-muted mb-3">Ingresá tu email y te generaremos un enlace para restablecer tu acceso.</p>
    <form method="post">
      {{ m.csrf() }}
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="email">Email</label>
        <input id="email" type="email" class="form-control" name="email" required autocomplete="email">
      </div>
      <button type="submit" class="p-2 btn btn-primary w-100 fw-semibold">Generar enlace de recuperación</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.index') }}" class="small">← Volver al ingreso</a>
    </div>
  </div>
</div>
{% endblock %}
