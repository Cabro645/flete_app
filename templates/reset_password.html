{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Restablecer contraseña · FleteApp{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 480px;">
  <div class="panel p-4 shadow">
    <h1 class="h4 fw-bold text-primary mb-3">Nueva contraseña</h1>
    <form method="post">
      {{ m.csrf() }}
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="password">Nueva contraseña (mínimo 8 caracteres)</label>
        <input id="password" type="password" class="form-control" name="password" minlength="8" required autocomplete="new-password">
      </div>
      <button type="submit" class="p-2 btn btn-primary w-100 fw-semibold">Guardar nueva contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
